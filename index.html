ex].quiz[question][2];b.classList.add(correct?'good':'bad');$('.feedback').textContent=correct?'Doğru! Yeni bir bilgi keşfettin.':'Hikâyedeki ipucunu düşün ve tekrar dene.';if(correct){answered=true;document.querySelectorAll('.option').forEach(x=>x.disabled=true);const next=$('[data-next-question]');next.hidden=false;next.textContent=question===data[index].quiz.length-1?'Mührünü al →':'Sonraki soru →';next.focus()}return}if(b.hasAttribute('data-next-question')&&answered){if(question<data[index].quiz.length-1){question++;lessonBody();$('.option')?.focus()}else{completed.add(index);try{localStorage.setItem('longora-1',JSON.stringify([...completed]))}catch{}progress();$('#papercontent').innerHTML='<div class="chapter">Keşif tamamlandı</div><h2 id="sheettitle">Mührünü kazandın!</h2><div class="seal">✦ '+data[index].name+' · 3 / 3 doğru</div><p>Artık bu efsanenin üç önemli ayrıntısını biliyorsun.</p><button class="paper-action primary" data-finish>Karaktere dön</button>'; $('[data-finish]').focus()}return}if(b.hasAttribute('data-finish'))closeSheet()};document.addEventListener('keydown',e=>{if($('#sheet').classList.contains('open')){if(e.key==='Escape')closeSheet();if(e.key==='Tab'){let buttons=[...$('.paper').querySelectorAll('button:not(:disabled):not([hidden])')];if(e.shiftKey&&document.activeElement===buttons[0]){e.preventDefault();buttons.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===buttons.at(-1)){e.preventDefault();buttons[0].focus()}}return}if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)});$('#papercontent').addEventListener('input',e=>{if(e.target.id==='atlas-search')$('#atlas-results').innerHTML=atlasList(e.target.value)});$('#toggle-hotspots').onclick=()=>{hotspotMode=!hotspotMode;updateHotspots()};$('#focus-view').onclick=()=>{focusMode=!focusMode;$('#app').classList.toggle('focus-view',focusMode);$('#focus-view').setAttribute('aria-pressed',String(focusMode));$('#focus-view').setAttribute('aria-label',focusMode?'Normal görünüme dön':'Sahneyi tam ekran incele')};$('#stage').addEventListener('click',e=>{const b=e.target.closest('[data-hotspot]');if(b&&hotspotMode){power(Number(b.dataset.hotspot));const fresh=$('#stage [data-hotspot="'+b.dataset.hotspot+'"]');if(e.detail===0)fresh?.focus()}});$('#stage').addEventListener('keydown',e=>{const b=e.target.closest('[data-hotspot]');if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();power(Number(b.dataset.hotspot));$('#stage [data-hotspot="'+b.dataset.hotspot+'"]')?.focus()}});let start=null;$('#stage').addEventListener('pointerdown',e=>{if(e.target.closest('[data-hotspot]'))return;start={x:e.clientX,y:e.clientY};$('#stage').setPointerCapture(e.pointerId)});$('#stage').addEventListener('pointerup',e=>{if(!start)return;let dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.4)step(dx<0?1:-1);start=null});$('#stage').addEventListener('pointercancel',()=>start=null);$('#stage').addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||start||window.matchMedia?.('(prefers-reduced-motion: reduce)').matches)return;const r=$('#stage').getBoundingClientRect();$('#stage').style.setProperty('--panx',((e.clientX-r.left)/r.width-.5)*12+'px');$('#stage').style.setProperty('--pany',((e.clientY-r.top)/r.height-.5)*8+'px')});$('#stage').addEventListener('pointerleave',()=>{$('#stage').style.setProperty('--panx','0px');$('#stage').style.setProperty('--pany','0px')});render(false);updateHotspots();
