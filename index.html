const data=[
{name:'Sun Wukong',han:'孙悟空 · Sūn Wùkōng',world:'Çiçek ve Meyve Dağı',kind:'01 / Efsanevi kahraman',sky:'#c9dbbd',grass:'#82a578',side:'#7b7250',accent:'#a43f31',lead:'Maymun Kral: çevik, zeki ve bazen biraz fazla kendine güvenen bir yolcu.',story:'Bir taşın içinden doğan Sun Wukong, büyü öğrenir ve güçlü bir kahramana dönüşür. Batıya Yolculuk adlı romanda bir keşişe eşlik eder. Yol boyunca yalnızca gücünü değil, sabrını ve arkadaşlarına güvenmeyi de öğrenir.',fact:'Ruyi Jingu Bang adlı büyülü asası boyut değiştirebilir. Dönüşüm teknikleri ve bulut yolculuğu da ünlü yeteneklerindendir.',culture:'Batıya Yolculuk, Çin edebiyatının önemli klasik romanlarından biridir.',powers:[['Büyülü asa','Asa büyür ve küçülür.','staff'],['Bulut yolculuğu','Maymun Kral bulutların üzerinde yol alabilir.','cloud'],['Dönüşüm','Dönüşüm teknikleriyle farklı biçimlere bürünebilir.','transform']],q:'Sun Wukong’un büyülü eşyası hangisidir?',a:['Bir ay feneri','Boyut değiştiren asa','Bir güneş taşı'],correct:1},
{name:'Chang’e',han:'嫦娥 · Cháng’é',world:'Ay Sarayı',kind:'02 / Ay efsanesi',sky:'#c0c9e2',grass:'#a5b9c6',side:'#64718e',accent:'#826eae',lead:'Ay ile ilişkilendirilen efsanevi kadın ve Sonbahar Ortası Festivali’nin simgelerinden biri.',story:'Bir efsaneye göre Chang’e ölümsüzlük iksirini içer ve Ay’a yükselir. Hikâyenin neden iksiri içtiğini farklı biçimlerde anlatan sürümleri vardır. Ay’daki evi, özlem ve kavuşma düşüncelerini hatırlatır.',fact:'Yeşim Tavşanı, birçok Ay anlatısında iksir hazırlayan bir yol arkadaşıdır.',culture:'Sonbahar Ortası Festivali’nde aileler dolunayı izler ve ay çörekleri paylaşır.',powers:[['Ay yolculuğu','Chang’e efsanede Ay’a yükselir.','cloud'],['Yeşim Tavşanı','Ay tavşanı birçok anlatıda iksir hazırlar.','rabbit'],['Ay ışığı','Dolunay, festivalin önemli simgelerindendir.','moon']],q:'Chang’e hangi gök cismiyle ilişkilendirilir?',a:['Mars','Güneş','Ay'],correct:2},
{name:'Nezha',han:'哪吒 · Nézhā',world:'Göksel Geçit',kind:'03 / Efsanevi kahraman',sky:'#f1c6aa',grass:'#c3ac74',side:'#9d6d50',accent:'#c34833',lead:'Ateş ve rüzgâr tekerlekleriyle tanınan genç kahraman.',story:'Nezha, Çin halk anlatılarında ve Tanrıların Görevlendirilmesi adlı romanda yer alır. Deniz krallığıyla yaşadığı çatışmalar, sorumluluk ve cesaret üzerine farklı biçimlerde anlatılır. Bazı anlatılarda lotus çiçeği onun yeniden doğuşuyla ilişkilidir.',fact:'Rüzgâr-ateş tekerlekleri, kırmızı kurdele ve büyülü halka Nezha’nın tanınan simgeleridir.',culture:'Nezha’nın hikâyeleri edebiyatta, halk kültüründe ve dini geleneklerde farklı biçimlerde yaşar.',powers:[['Ateş tekerlekleri','Tekerlekler Nezha’nın hızlı hareketini simgeler.','fire'],['Kırmızı kurdele','Büyülü kurdele karakterin bilinen eşyalarındandır.','ribbon'],['Lotus','Lotus, bazı anlatılarda yeniden doğuşuyla ilişkilidir.','lotus']],q:'Nezha’nın ayaklarının altında ne bulunur?',a:['Rüzgâr-ateş tekerlekleri','Bir kayık','Ay çörekleri'],correct:0},
{name:'Nüwa',han:'女娲 · Nǚwā',world:'Onarılan Gökyüzü',kind:'04 / Yaratılış efsanesi',sky:'#d8d4ab',grass:'#9cae77',side:'#8d7955',accent:'#398c84',lead:'İnsanları yaratan ve gökyüzünü onaran figürlerden biri.',story:'Bazı Çin yaratılış efsanelerinde Nüwa insanları topraktan şekillendirir. Gökyüzü zarar gördüğünde renkli taşları kullanarak onu onarır. Bu hikâye, dünyayı korumak ve yeniden düzenlemek üzerine anlatılır.',fact:'Nüwa bazı geleneksel resimlerde insan başlı, yılan gövdeli olarak tasvir edilir.',culture:'Çin yaratılış efsanelerinin tek bir sürümü yoktur; Nüwa ve Pangu anlatıları farklı geleneklerden gelir.',powers:[['Beş renkli taş','Renkli taşlarla gökyüzünü onarır.','stones'],['Topraktan insan','Bazı anlatılarda insanları topraktan şekillendirir.','clay'],['Gökyüzünü onar','Efsane doğayı korumayı düşünmemizi sağlar.','rainbow']],q:'Nüwa gökyüzünü neyle onarır?',a:['Bambu','Renkli taşlarla','Ay çörekleriyle'],correct:1},
{name:'Pangu',han:'盘古 · Pángǔ',world:'Dünyanın Doğuşu',kind:'05 / Yaratılış efsanesi',sky:'#c7d9d6',grass:'#819b7c',side:'#69775c',accent:'#865d3d',lead:'Gökyüzü ile yeryüzünü ayıran efsanevi dev.',story:'Yaratılış anlatılarından birinde Pangu, yumurta benzeri bir başlangıçtan ortaya çıkar. Gökyüzü ile yeri birbirinden ayırır. Daha sonra bedeninin parçaları doğanın çeşitli öğelerine dönüşür. Bunlar evrenin oluşumunu anlatan mitolojik simgelerdir.',fact:'Bazı anlatılarda gözleri Güneş ve Ay’a, nefesi rüzgâra dönüşür.',culture:'Bu anlatı bilimsel bir evren açıklaması değil, kültürel bir yaratılış efsanesidir.',powers:[['Göğü ayır','Pangu gökyüzü ile yeryüzünü ayırır.','sky'],['Güneş ve Ay','Gözleri iki gök cismine dönüşür.','moon'],['Dağlar','Bazı anlatılarda bedeninden dağlar oluşur.','mountain']],q:'Pangu’nun öyküsü hangi konuyu anlatır?',a:['Bir yemek tarifi','Bir yarış','Dünyanın yaratılışı'],correct:2},
{name:'Hou Yi',han:'后羿 · Hòu Yì',world:'On Güneş Vadisi',kind:'06 / Efsanevi okçu',sky:'#f2d1a0',grass:'#b8a76d',side:'#a17750',accent:'#a55c32',lead:'On güneş efsanesinde yeryüzünü aşırı sıcaktan koruyan okçu.',story:'Bir efsanede on güneş aynı anda gökyüzüne çıkar ve yeryüzü çok ısınır. Hou Yi dokuzunu düşürür; bir güneş gökyüzünde kalır. Hikâyenin başka bölümlerinde Chang’e ile karşılaşırız.',fact:'Hou Yi’nin en tanınan simgesi yayıdır. Anlatının ana fikirlerinden biri dengedir.',culture:'On güneş öyküsü, doğayla insan arasındaki ilişkiyi mitolojik bir dille anlatır.',powers:[['On güneş','Efsanenin başında on güneş görünür.','suns'],['Dengeyi sağla','Dokuz güneş kaybolur, bir güneş kalır.','balance'],['Büyülü yay','Yay, Hou Yi’nin en tanınan simgesidir.','bow']],q:'Efsanenin sonunda kaç güneş kalır?',a:['Bir','Beş','On'],correct:0}];
const $=s=>document.querySelector(s);let index=0,effect='',completed=new Set(),timer,returnFocus;try{completed=new Set(JSON.parse(localStorage.getItem('longora-1')||'[]').filter(x=>Number.isInteger(x)&&x>=0&&x<data.length))}catch{};

function peak(x,y,k,c){return `<g transform="translate(${x} ${y}) scale(${k})">${poly('-105,25 -26,-146 11,-92 100,18 0,57',c)}${poly('-26,-146 0,57 -105,25','#ffffff19')}${poly('-26,-146 11,-92 100,18 0,57','#0a292b50')}${poly('-26,-146 -48,-100 -10,-111 11,-92','#e8d9ac70')}</g>`}function cloud(x,y,k=1){return `<g transform="translate(${x} ${y}) scale(${k})" fill="#f4e5c2" opacity=".38"><path d="M-110 14Q-103 1-76 2Q-63-24-40-13Q-14-42 7-16Q37-25 48-4Q84-6 91 13Z"/><path d="M-95 25H61M-59 34H31" stroke="#f4e5c2" stroke-width="3" stroke-linecap="round" opacity=".7"/></g>`}function tree(x,y,k,c){return `<g transform="translate(${x} ${y}) scale(${k})"><path d="M0 7V-52M0-20L-24-38" stroke="#79634b" stroke-width="8"/>${poly('-59,-36 -26,-83 0,-67 25,-93 60,-41 14,-18',c)}${poly('-26,-83 0,-67 14,-18 -59,-36','#ffffff22')}${poly('25,-93 60,-41 14,-18 0,-67','#123e3c40')}</g>`}
function scene(){let [bg,glow,gold,robe,land]=palettes[index],d=data[index],monkey=index===0,woman=index===1||index===3,nez=index===2,giant=index===4;let hair=monkey?'#a96b3b':giant?'#503d30':'#263432',skin=monkey?'#e3b07c':'#efc39a',dark='#263a38';let face=`<path d="M-79-86Q-77-160 0-167Q77-158 79-86L63-14 0 17-64-14Z" fill="${hair}"/><path d="M-61-104Q-55-133-23-121L0-104 23-121Q55-133 61-104L59-55 37-26 0-14-37-26-59-55Z" fill="${skin}"/><path d="M-61-104L-59-55-37-26 0-14 0-48-25-67Z" fill="#ffffff13"/><path d="M-59-55L-37-26 0-14 37-26 58-55 37-39 0-32-37-39Z" fill="#ad765a37"/><path d="M-41-87q14-9 28 0M13-87q14-9 28 0" stroke="#563f35" stroke-width="6" fill="none" stroke-linecap="round"/><ellipse cx="-26" cy="-74" rx="5.5" ry="7" fill="#253430"/><ellipse cx="26" cy="-74" rx="5.5" ry="7" fill="#253430"/><path d="M-5-68L-10-54 5-54" fill="none" stroke="#b17c61" stroke-width="3" stroke-linecap="round"/><path d="M-12-43Q0-35 12-43" stroke="#784b40" stroke-width="3" fill="none" stroke-linecap="round"/>`;

let props='';if(monkey)props=`<path d="M68 117Q180 149 185 63Q190 31 162 25" stroke="#b77f49" stroke-width="18" fill="none" stroke-linecap="round"/><g class="staff" transform="rotate(15 142 80)"><path d="M145-119V253" stroke="#9e412f" stroke-width="18" stroke-linecap="round"/><path d="M145-119v38m0 296v38" stroke="#eac674" stroke-width="22" stroke-linecap="round"/></g>`;if(index===1)props=`<path d="M-65 28Q-205-70-182 90T-130 200M65 28Q200-60 185 85T129 203" fill="none" stroke="#e8c5b8" stroke-width="12" opacity=".8" class="ribbon"/><g transform="translate(146 211)"><ellipse rx="36" ry="25" fill="#e8e2d2"/><circle cy="-30" r="22" fill="#f8eed9"/><ellipse cx="-10" cy="-58" rx="7" ry="23" fill="#f8eed9"/><ellipse cx="11" cy="-58" rx="7" ry="23" fill="#f8eed9"/><circle cx="7" cy="-31" r="3" fill="#35423f"/></g>`;if(nez)props=`<path class="ribbon" d="M-66 22Q-225-12-191 94T-120 183M66 22Q230 0 178-79" fill="none" stroke="#df5542" stroke-width="17"/><g fill="none" stroke="#f6b75d" stroke-width="12"><ellipse class="wheel" cx="-48" cy="263" rx="49" ry="20" stroke-dasharray="24 5"/><ellipse class="wheel" cx="48" cy="263" rx="49" ry="20" stroke-dasharray="24 5"/></g><circle cx="151" cy="86" r="37" stroke="#e6c16c" stroke-width="10" fill="none"/>`;if(index===3)props=`<path d="M-58 211Q-135 280-170 245Q-212 201-250 263Q-189 309-98 290L24 248" fill="#588e7b" stroke="#9dbc99" stroke-width="5"/>${['#d17a63','#e7c66e','#84c6b1','#b8a6dc','#f5eed7'].map((c,j)=>`<g class="orb" transform="translate(${108+j*23} ${36-22*Math.sin(j)})">${poly('0,-18 13,-3 8,15 -10,12 -17,-3',c)}${poly('0,-18 0,4 -17,-3','#ffffff45')}</g>`).join('')}`;if(giant)props=`<path d="M140-95L113 236" stroke="#a78056" stroke-width="15"/><path d="M140-108L208-151 225-66 133-63Z" fill="#a6b6af"/><path d="M140-108L208-151 187-88 133-63Z" fill="#d6dcd0"/>`;if(index===5)props=`<path d="M143-100Q234 65 143 219" fill="none" stroke="#c89e60" stroke-width="12"/><path d="M143-100V219M128 72L238 72" stroke="#f4e0aa" stroke-width="3"/><path d="M238 72l-15-8v16z" fill="#f4e0aa"/>`;
let special='';if(effect==='cloud')special=`<g class="magic" transform="translate(0 247)">${cloud(0,0,1.4)}</g>`;if(effect==='transform')special=`<g class="magic" transform="translate(-155 -103)" fill="#f1d48e"><path d="M-54 3Q-30-30 0-2Q30-30 54 3L0 27Z"/></g>`;if(effect==='lotus')special=`<g class="magic" transform="translate(0 255)" fill="#eab0b4">${Array.from({length:7},(_,j)=>`<ellipse rx="17" ry="65" transform="rotate(${j*25-75})" opacity=".8"/>`).join('')}</g>`;if(effect==='clay')special=`<g class="magic" transform="translate(-165 180)" fill="#b68c6a"><circle cy="-23" r="15"/><path d="M-15-7H15L23 31H-23Z"/></g>`;if(effect==='rainbow')special=`<g class="magic" fill="none" stroke-width="8" opacity=".8"><path d="M-210-102Q0-330 210-102" stroke="#df9b79"/><path d="M-200-101Q0-310 200-101" stroke="#edd195"/><path d="M-190-100Q0-290 190-100" stroke="#a4c9a0"/></g>`;if(effect==='mountain')special=`<g class="magic">${peak(-185,220,.55,'#93aa8b')}${peak(180,220,.6,'#93aa8b')}</g>`;
let celestial=index===5?Array.from({length:effect==='balance'?10:10},(_,j)=>`<circle class="${effect==='balance'&&j>0?'sunfade':''}" style="${effect==='balance'&&j>0?'animation-fill-mode:forwards;opacity:0':''}" cx="${262+j*53}" cy="${134+Math.sin(j*.6)*36}" r="${j===0?25:15}" fill="#f7c879" opacity=".88"/>`).join(''):`<circle cx="650" cy="208" r="${index===1?127:110}" fill="${gold}" opacity=".76"/><circle cx="650" cy="208" r="${index===1?139:122}" fill="none" stroke="${gold}" opacity=".35" stroke-width="1"/>`;
return `<svg viewBox="0 0 1000 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${d.name} ve ${d.world} çizimi"><defs><linearGradient id="base" x2="0" y2="1"><stop stop-color="${land}"/><stop offset="1" stop-color="${bg}"/></linearGradient><radialGradient id="halo"><stop stop-color="${gold}" stop-opacity=".19"/><stop offset="1" stop-color="${gold}" stop-opacity="0"/></radialGradient><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".36" numOctaves="3" stitchTiles="stitch" result="noise"/><feColorMatrix in="noise" type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".13"/></feComponentTransfer><feComposite in2="SourceGraphic" operator="in" result="tex"/><feBlend in="SourceGraphic" in2="tex" mode="soft-light"/></filter></defs><ellipse cx="520" cy="430" rx="395" ry="345" fill="url(#halo)"/>${celestial}<g opacity=".55">${peak(260,470,1.15,glow)}${peak(420,389,.85,glow)}${peak(730,466,1.2,glow)}${peak(810,491,.65,glow)}</g><g class="drift">${cloud(272,321,.8)}${cloud(743,362,1)}${cloud(374,180,.55)}</g><g transform="translate(0 8)" filter="url(#grain)"><ellipse cx="510" cy="754" rx="254" ry="39" fill="#102b27" opacity=".45"/>${poly('195,632 506,505 813,629 513,755','url(#base)')}${poly('195,632 513,755 513,800 195,677','#675b43')}${poly('513,755 813,629 813,675 513,800','#3c574a')}${poly('195,632 506,505 513,755','#ffffff14')}${poly('513,755 813,629 683,598 431,720','#f4dba222')}<path d="M340 583L385 613 363 633 431 661 400 686 513 755" fill="none" stroke="#9bc7bc" stroke-width="16" opacity=".77"/>${tree(260,630,.95,glow)}${tree(725,631,1.15,glow)}${tree(670,585,.65,glow)}<ellipse cx="508" cy="670" rx="169" ry="28" fill="#102e29" opacity=".3"/></g><g transform="translate(505 410) scale(${giant?1.12:1.05})"><g class="hero"><g class="cloudride" filter="url(#grain)">${arms}${clothes}${head}${props}${special}</g></g></g><g fill="#e8d49c" opacity=".72">${Array.from({length:13},(_,j)=>`<circle cx="${240+(j*67)%520}" cy="${230+(j*109)%440}" r="${j%3+1}"/>`).join('')}</g></svg>`}
function progress(){$('#progress').textContent=`${completed.size} / ${data.length}`};function render(animate=true){clearTimeout(timer);effect='';const d=data[index],p=palettes[index];$('#app').style.setProperty('--bg',p[0]);$('#app').style.setProperty('--glow',p[1]);$('#name').textContent=d.name;$('#kanji').textContent=d.han.split(' · ')[0];$('#pron').textContent=d.han;$('#chapter').textContent=`Efsane ${pad(index+1)} · ${d.world}`;$('#lead').textContent=d.lead;$('#annotation').textContent=marks[index];$('#number').textContent=`${pad(index+1)} / ${pad(data.length)}`;$('#stage').className='stage';$('#stage').innerHTML=scene();if(animate){void $('#stage').offsetWidth;$('#stage').classList.add('enter')}$('#effecttext').classList.remove('show');$('#powers').innerHTML=d.powers.map((p,j)=>`<button class="power" data-power="${j}" aria-label="${p[0]}" aria-pressed="false"><span class="plabel">${p[0]}</span><span class="sym" aria-hidden="true">${symbols[index][j]}</span></button>`).join('');$('#dots').innerHTML=data.map((c,j)=>`<button class="dot" data-index="${j}" aria-label="${c.name}" aria-current="${index===j}"></button>`).join('');$('#prev').disabled=index===0;$('#next').disabled=index===data.length-1;progress()}
function move(n){if(n<0||n>=data.length||n===index)return;index=n;render()};function power(j){let p=data[index].powers[j];clearTimeout(timer);effect=p[2];$('#stage').className='stage';$('#stage').innerHTML=scene();void $('#stage').offsetWidth;$('#stage').classList.add('action');document.querySelectorAll('.power').forEach((b,k)=>b.setAttribute('aria-pressed',k===j));$('#effecttext').textContent=p[1];$('#effecttext').classList.add('show');timer=setTimeout(()=>$('#effecttext').classList.remove('show'),4200)}
function openSheet(atlas=false){returnFocus=document.activeElement;let d=data[index];$('#papercontent').innerHTML=atlas?`<div class="chapter">${completed.size} keşif mührü</div><h2 id="sheettitle">Efsaneler atlası</h2><p>Her efsanede yeni bir dünya keşfet.</p>${data.map((x,j)=>`<button class="atlasitem" data-choose="${j}"><span>${x.han.split(' · ')[0].slice(0,1)}</span><b>${x.name}<small>${x.world}</small></b><em>${completed.has(j)?'✓':'↗'}</em></button>`).join('')}`:`<div class="chapter">${d.kind}</div><h2 id="sheettitle">${d.name}</h2><p>${d.han}</p><h3>Bir zamanlar…</h3><p>${d.story}</p><h3>Güçleri ve sembolleri</h3><p>${d.fact}</p><h3>Bugünün kültüründe</h3><p>${d.culture}</p><h3>Bir keşif mührü kazan</h3><p>${d.q}</p>${d.a.map((a,j)=>`<button class="option" data-answer="${j}">${a}</button>`).join('')}<p class="feedback" role="status"></p><p style="font-size:12px;color:#766b58">Bu hikâyeler mitolojik anlatılardır; farklı sürümleri olabilir.</p>`;$('#sheet').inert=false;$('#sheet').classList.add('open');document.querySelectorAll('header,.info,.powers,.nav').forEach(x=>x.inert=true);$('.paper').scrollTop=0;$('#close').focus()};function closeSheet(){if(!$('#sheet').classList.contains('open'))return;$('#sheet').classList.remove('open');$('#sheet').inert=true;document.querySelectorAll('header,.info,.powers,.nav').forEach(x=>x.inert=false);if(returnFocus?.isConnected)returnFocus.focus()}
$('#prev').onclick=()=>move(index-1);$('#next').onclick=()=>move(index+1);$('#read').onclick=()=>openSheet();$('#atlas').onclick=()=>openSheet(true);$('#close').onclick=closeSheet;$('#sheet').onclick=e=>{if(e.target===$('#sheet'))closeSheet()};$('#dots').onclick=e=>{let b=e.target.closest('[data-index]');if(b)move(+b.dataset.index)};$('#powers').onclick=e=>{let b=e.target.closest('[data-power]');if(b)power(+b.dataset.power)};$('#papercontent').onclick=e=>{let b=e.target.closest('[data-choose]');if(b){closeSheet();move(+b.dataset.choose);return}b=e.target.closest('[data-answer]');if(!b)return;let correct=+b.dataset.answer===data[index].correct;b.classList.add(correct?'good':'bad');$('.feedback').textContent=correct?'Doğru! Keşif mührünü kazandın.':'Bir daha düşün. Hikâyedeki ipucuna bakabilirsin.';if(correct){completed.add(index);try{localStorage.setItem('longora-1',JSON.stringify([...completed]))}catch{};progress();document.querySelectorAll('.option').forEach(x=>x.disabled=true)}};document.addEventListener('keydown',e=>{if($('#sheet').classList.contains('open')){if(e.key==='Escape')closeSheet();if(e.key==='Tab'){let buttons=[...$('.paper').querySelectorAll('button:not(:disabled)')];if(e.shiftKey&&document.activeElement===buttons[0]){e.preventDefault();buttons.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===buttons.at(-1)){e.preventDefault();buttons[0].focus()}}return}if(e.key==='ArrowLeft')move(index-1);if(e.key==='ArrowRight')move(index+1)});let start=null;$('#swipe').addEventListener('pointerdown',e=>{start={x:e.clientX,y:e.clientY};$('#swipe').setPointerCapture(e.pointerId)});$('#swipe').addEventListener('pointerup',e=>{if(!start)return;let dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.4)move(index+(dx<0?1:-1));start=null});$('#swipe').addEventListener('pointercancel',()=>start=null);render(false);
</script></body></html>
